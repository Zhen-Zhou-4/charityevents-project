<!DOCTYPE html>
<html lang="en">
<head>

    <title>Event Details | Charity Events</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html">Home</a>
            <a href="search.html">Search Events</a>
        </div>
    </nav>

    <!-- 详情页动态 Banner（由 JS 动态替换背景图和标题） -->

        <div class="page-banner-content">
            <h1 id="detail-banner-title">Event Details</h1>
        </div>

    <div class="container">

            <h3 style="color: var(--primary-color); margin-bottom: 15px;">Notice</h3>
            <p>This feature is currently under construction.</p>
            <button class="btn" style="margin-top: 20px;" onclick="document.getElementById('register-modal').style.display='none'">Close</button>
